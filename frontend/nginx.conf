server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single Page App: unknown paths fall back to index.html so React handles them
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change -> let the browser cache them for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
