[project]
name = "todo-backend"
version = "0.1.0"
description = "Todo API - FastAPI + Pydantic + JWT, JSON file as DB"
authors = [
    { name = "RVicky172", email = "rohillavicky172@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]
